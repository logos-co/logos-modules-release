name: Rebuild index

# Regenerates the rolling `index` release (index.json — the catalog
# clients fetch) whenever a package release is published — including
# releases published by the Jenkins pipeline, which is why there is a
# wait job: the release event fires on creation, but the .lgx and
# sidecar.json assets are uploaded moments later, so we poll until
# they exist before rebuilding. Also runs on a six-hourly schedule as
# a catch-up so a missed or timed-out run can't strand the catalog,
# and can be kicked manually from the Actions UI.
#
# Rebuild itself is a thin passthrough to the versioned action.

on:
  release:
    types: [published]
  workflow_dispatch: {}
  repository_dispatch:
    types: [rebuild-index]
  schedule:
    - cron: '17 */6 * * *'

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

# One rebuild at a time; a burst of release events (multi-module
# Jenkins run) collapses into the running one plus a single queued run.
concurrency:
  group: rebuild-index
  cancel-in-progress: false

jobs:
  wait-for-assets:
    # Only release events need the wait; other triggers pass through.
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for i in $(seq 1 30); do
            assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                       --jq '[.assets[].name] | join(" ")')
            case "$assets" in
              *.lgx*sidecar.json*|*sidecar.json*.lgx*)
                echo "assets present: $assets"; exit 0 ;;
            esac
            echo "waiting for assets on ${TAG} (have: ${assets:-none})"
            sleep 10
          done
          echo "::warning::assets never appeared on ${TAG} — rebuilding anyway; the 6-hourly schedule will catch it if this release lands later"

  rebuild:
    needs: wait-for-assets
    uses: logos-co/logos-modules-release-action/.github/workflows/rebuild-index.yml@v1
