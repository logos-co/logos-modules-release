name: _release-module

# The official Logos catalog no longer builds or publishes releases on
# GitHub Actions. Releases are built, SIGNED, and published by the
# Jenkins pipeline: merging a metadata.json version bump to master
# releases that module automatically.
#
# This file is kept (rather than deleted) so the per-module
# release-<repo>.yml workflows and release-all.yml still parse; pressing
# their buttons fails fast with this explanation instead of a cryptic
# "workflow not found".
#
# Force-republish of an already-released version (the old force_build)
# is a manual Jenkins run with MODULES=<module>, SKIP_IF_PUBLISHED=false.
#
# Forks / the base repo are unaffected — they carry their own copy of
# the original pipeline; see logos-co/logos-modules-release-base.

on:
  workflow_call:
    inputs:
      module_path:
        description: "Unused — kept for caller compatibility."
        type: string
        required: true
      force_build:
        description: "Unused — kept for caller compatibility."
        type: boolean
        default: false

jobs:
  moved-to-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Releases moved to Jenkins
        run: |
          echo "::error::The official Logos catalog releases from Jenkins, not GitHub Actions."
          echo "::error::To release: merge the module's metadata.json version bump to master — it publishes automatically, signed."
          echo "::error::To force-republish an existing version: manual Jenkins run with MODULES=<module> and SKIP_IF_PUBLISHED=false."
          exit 1